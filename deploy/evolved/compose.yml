name: hapi-evolved
x-runtime: &runtime
  restart: unless-stopped
  user: "${EVOLVED_UID:-1000}:${EVOLVED_GID:-1000}"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
services:
  hub:
    <<: *runtime
    build: { context: ../.., dockerfile: deploy/evolved/Dockerfile }
    image: hapi-evolved:0.1.0
    environment:
      HAPI_EVOLVED_ENABLED: "1"
      HAPI_HOME: /data
      HAPI_LISTEN_HOST: 0.0.0.0
      HAPI_LISTEN_PORT: "3006"
      HAPI_IOS_PUSH: "off"
      HAPI_ANDROID_PUSH: "off"
      HAPI_PUBLIC_URL: "${EVOLVED_ORIGIN:?Set the private HTTPS origin}"
      EVOLVED_ORIGIN: "${EVOLVED_ORIGIN}"
      EVOLVED_CODE_ROOTS: '["/workspaces"]'
      EVOLVED_MANAGED_WORKSPACE_ROOT: /managed-workspaces
      EVOLVED_VAULT_URL: http://vault:3212
      EVOLVED_VAULT_SIGNING_KEY_FILE: /credentials/vault-signing.pem
      EVOLVED_SERVICE_TOKEN_FILE: /credentials/service.token
      EVOLVED_CODEGRAPH_URL: http://codegraph:8011
      EVOLVED_MEMORY_URL: http://memory:8012
    ports: ["127.0.0.1:${EVOLVED_LISTEN_PORT:-3006}:3006"]
    volumes:
      - ${EVOLVED_STATE_DIR:?Run deploy/evolved/init.ts}/hub:/data
      - ${EVOLVED_STATE_DIR}/credentials/hub:/credentials:ro
      - ${EVOLVED_STATE_DIR}/workspaces:/workspaces:ro
      - ${EVOLVED_STATE_DIR}/managed-workspaces:/managed-workspaces
    networks: [backend, frontend]
    depends_on: [vault, codegraph, memory]
    mem_limit: 2g
    healthcheck:
      test: [CMD, bun, -e, "fetch('http://127.0.0.1:3006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
  vault:
    <<: *runtime
    image: hapi-evolved:0.1.0
    command: [bun, hub/src/evolved/vaultServer.ts]
    environment:
      EVOLVED_VAULT_HOST: 0.0.0.0
      EVOLVED_VAULT_DB_PATH: /data/vault.db
      EVOLVED_VAULT_MASTER_KEY_FILE: /credentials/master.key
      EVOLVED_VAULT_PUBLIC_KEY_FILE: /credentials/hub-public.pem
      EVOLVED_VAULT_ACTIONS_FILE: /credentials/actions.json
    volumes:
      - ${EVOLVED_STATE_DIR}/vault:/data
      - ${EVOLVED_STATE_DIR}/credentials/vault:/credentials:ro
    networks: [backend, broker-egress]
    mem_limit: 768m
  codegraph:
    <<: *runtime
    build: { context: ../.., dockerfile: services/codegraph/Dockerfile }
    image: hapi-evolved-codegraph:0.1.0
    environment:
      EVOLVED_CODEGRAPH_HOST: 0.0.0.0
      EVOLVED_CODE_ROOTS: '["/workspaces","/managed-workspaces"]'
      EVOLVED_SERVICE_TOKEN_FILE: /credentials/service.token
      EVOLVED_CODEGRAPH_MAX_PROJECTS: "4"
      EVOLVED_CODEGRAPH_STATE_DIR: /data
    volumes:
      - ${EVOLVED_STATE_DIR}/workspaces:/workspaces:ro
      - ${EVOLVED_STATE_DIR}/managed-workspaces:/managed-workspaces:ro
      - ${EVOLVED_STATE_DIR}/codegraph:/data
      - ${EVOLVED_STATE_DIR}/credentials/codegraph:/credentials:ro
    networks: [backend]
    mem_limit: 2300m
  memory:
    <<: *runtime
    build: { context: ../.., dockerfile: services/memory/Dockerfile }
    image: hapi-evolved-memory:0.1.0
    environment:
      EVOLVED_SERVICE_TOKEN_FILE: /credentials/service.token
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD_FILE: /credentials/neo4j.password
      OPENAI_API_KEY_FILE: /credentials/provider.key
      EVOLVED_MEMORY_MODEL: ${EVOLVED_MEMORY_MODEL:-}
      EVOLVED_MEMORY_EMBEDDING_MODEL: ${EVOLVED_MEMORY_EMBEDDING_MODEL:-}
      EVOLVED_MEMORY_INPUT_USD_PER_MTOK: ${EVOLVED_MEMORY_INPUT_USD_PER_MTOK:-}
      EVOLVED_MEMORY_OUTPUT_USD_PER_MTOK: ${EVOLVED_MEMORY_OUTPUT_USD_PER_MTOK:-}
      EVOLVED_MEMORY_EMBEDDING_USD_PER_MTOK: ${EVOLVED_MEMORY_EMBEDDING_USD_PER_MTOK:-}
      EVOLVED_MEMORY_API_BASE: ${EVOLVED_MEMORY_API_BASE:-https://api.openai.com/v1}
    volumes:
      - ${EVOLVED_STATE_DIR}/memory:/data
      - ${EVOLVED_STATE_DIR}/credentials/memory:/credentials:ro
    networks: [backend, model-egress]
    depends_on: [neo4j]
    mem_limit: 1g
  neo4j:
    <<: *runtime
    # The official entrypoint materializes neo4j.conf from environment options.
    read_only: false
    # Neo4j's JNA library is unpacked and memory-mapped from its private tmpfs.
    tmpfs: ["/tmp:rw,exec,nosuid,size=128m"]
    image: neo4j:2026.09.0
    environment:
      NEO4J_AUTH_FILE: /credentials/auth
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
      NEO4J_server_http_enabled: "false"
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_dbms_fleet__manager_enabled: "false"
      NEO4J_server_fleet__discovery_enabled: "false"
      NEO4J_server_bolt_telemetry_enabled: "false"
    volumes:
      - ${EVOLVED_STATE_DIR}/neo4j:/data
      - ${EVOLVED_STATE_DIR}/neo4j-logs:/logs
      - ${EVOLVED_STATE_DIR}/credentials/neo4j:/credentials:ro
    networks: [backend]
    mem_limit: 1500m
networks:
  frontend: {}
  backend: { internal: true }
  broker-egress: {}
  model-egress: {}
