name: hapi-evolved-runner-${EVOLVED_PROJECT_ID:?Project ID required}
x-runner: &runner
  user: "${EVOLVED_UID:-1000}:${EVOLVED_GID:-1000}"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  restart: "${EVOLVED_RUNNER_RESTART_POLICY:-unless-stopped}"
  tmpfs: ["/tmp:rw,nosuid,size=256m"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
services:
  runner:
    <<: *runner
    # Native Codex constructs its read-only/workspace sandbox with unprivileged
    # user namespaces. Load this named enforce profile during host setup.
    security_opt:
      - no-new-privileges:true
      - apparmor=hapi-evolved-runner
      - seccomp=./security/runner-seccomp.json
    build: { context: ../.., dockerfile: deploy/evolved/Runner.Dockerfile }
    image: hapi-evolved-runner:0.1.0
    user: "0:0"
    # Root supervisor has no DAC override and cannot traverse the private user home.
    working_dir: /
    cap_add: [SETUID, SETGID, SETPCAP]
    command: [bun, /app/services/runner-proxy/supervisor.ts]
    environment:
      HAPI_API_URL: http://runner-proxy:3010
      HAPI_EVOLVED_URL: http://runner-proxy:3010
      HAPI_EVOLVED_PROXY: "1"
      EVOLVED_PROJECT_ID: ${EVOLVED_PROJECT_ID:?Project ID required}
      CLI_API_TOKEN: evolved-local
      HAPI_RUNNER_SUPERVISED: "1"
      EVOLVED_RUNNER_UID: ${EVOLVED_UID:-1000}
      EVOLVED_RUNNER_GID: ${EVOLVED_GID:-1000}
      EVOLVED_RUNNER_ROOT: ${EVOLVED_WORKSPACE_PREFIX:-/workspaces}/${EVOLVED_PROJECT_DIRECTORY:?Project directory required}
      EVOLVED_RUNNER_PROFILE: ${EVOLVED_RUNNER_PROFILE:?Current project profile required}
      EVOLVED_RUNNER_WORKSPACE_DEVICE: ${EVOLVED_RUNNER_WORKSPACE_DEVICE:-}
      EVOLVED_RUNNER_WORKSPACE_INODE: ${EVOLVED_RUNNER_WORKSPACE_INODE:-}
    volumes:
      - ${EVOLVED_RUNNER_HOME:?Private runner home required}:/runner
      # Later host mounts must not propagate past the supervisor's startup check.
      - ${EVOLVED_RUNNER_WORKSPACE:?Only this project's workspace}:${EVOLVED_WORKSPACE_PREFIX:-/workspaces}/${EVOLVED_PROJECT_DIRECTORY}:${EVOLVED_WORKSPACE_MODE:-ro},rprivate
    networks: [project, provider-egress]
    mem_limit: 4g
    pids_limit: 512
    depends_on: [runner-proxy, egress]
  runner-proxy:
    <<: *runner
    image: hapi-evolved:0.1.0
    command: [bun, services/runner-proxy/server.ts]
    environment:
      EVOLVED_PROXY_HOST: 0.0.0.0
      EVOLVED_HUB_URL: http://hub:3006
      EVOLVED_PROJECT_ID: ${EVOLVED_PROJECT_ID}
      EVOLVED_RUNNER_LEASE_FILE: /credentials/lease
    volumes:
      - ${EVOLVED_RUNNER_LEASE_FILE:?Private lease file required}:/credentials/lease:ro
    networks: [project, backend]
    mem_limit: 512m
  egress:
    <<: *runner
    image: hapi-evolved:0.1.0
    command: [bun, services/runner-proxy/egress.ts]
    environment:
      EVOLVED_EGRESS_HOST: 0.0.0.0
      # Empty means all public Internet destinations, for every project profile.
      EVOLVED_EGRESS_HOSTS: ${EVOLVED_EGRESS_HOSTS:-}
    networks: [project, provider-egress]
    mem_limit: 128m
networks:
  project: { internal: true }
  provider-egress: {}
  backend:
    external: true
    name: ${EVOLVED_BACKEND_NETWORK:-hapi-evolved_backend}
