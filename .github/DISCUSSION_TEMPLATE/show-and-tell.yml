title: "[Pilot]: "
body:
  - type: markdown
    attributes:
      value: |
        Tell us about one HAPI-eVolved workflow or an installation that did not work.
        This is public and voluntary. Never include credentials, provider codes, private URLs, environment files, database dumps or private conversations.
        For vulnerabilities, use the repository's private security-reporting channel.
  - type: input
    id: version
    attributes:
      label: Evolved release or commit
      description: The distribution tag or source SHA, not only the inherited CLI package version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment (optional)
      description: Linux distribution/architecture, approximate RAM, browser; omit hostnames and IP addresses.
  - type: dropdown
    id: milestone
    attributes:
      label: Furthest milestone reached
      options:
        - Reading the installation guide
        - Core services started
        - Host control and provider login working
        - Project repository cloned
        - Session started in the selected checkout
        - Change reviewed with diff and Codegraph
        - Knowledge proposal created
        - Returned to use the project again
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What worked and what got in your way?
      description: Rough setup time, first confusing step, help needed and expected versus actual behavior. Redact any excerpt yourself.
    validations:
      required: true
  - type: textarea
    id: next
    attributes:
      label: One improvement you would value (optional)
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I checked this public report for secrets and private information.
          required: true
