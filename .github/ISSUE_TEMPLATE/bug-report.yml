name: Bug report
description: Report a reproducible problem in HAPI-eVolved.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for **HAPI-eVolved**, the independent BGGBTAC/hapi-evolved fork.
        Search existing issues first. For setup questions, use the Support request form.
        **Suspected vulnerability? Stop here and read [the security policy](https://github.com/BGGBTAC/hapi-evolved/security/policy).**
        Private reporting is available only when the repository is public and maintainers have enabled it; the policy explains the fallback.
        Use synthetic data. Do not paste secrets, environment files, private conversations, database backups or access-bearing URLs.
  - type: input
    id: version
    attributes:
      label: Evolved version and source commit
      description: Include the release/tag if known and `git rev-parse HEAD` from the checkout. A legacy CLI version alone does not identify Evolved.
      placeholder: "Evolved 0.1.0, commit …; CLI/agent versions …"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Repository Docker Compose stack
        - Source checkout / local development
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and affected component
      description: OS/architecture, browser/version, relevant agent and service versions, and any deployment differences. Do not include hostnames, IP addresses or user identifiers unless necessary and safe to share.
      placeholder: "Linux x86_64; browser …; Claude Code/Codex …; affected Hub/Web/runner/memory/codegraph …"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give a minimal sequence using synthetic data. Include required setup and how often it occurs; say if you have not found a reliable reproduction.
      placeholder: |
        1. Create a test project …
        2. …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and impact
      description: Include the visible error and whether a workaround exists.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs or screenshots
      description: Optional short excerpts only. Review them manually; remove tokens, cookies, keys, personal data, private project paths and conversation content. Never attach complete databases or environment files.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked this report and its attachments for secrets and private data, and it is not a public vulnerability disclosure.
          required: true
