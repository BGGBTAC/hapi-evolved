version: 2
# Automatic version-update PRs are disabled to avoid notification/rebase noise.
# Security-update PRs are disabled separately in the repository settings;
# Dependabot alerts and CodeQL remain enabled. See docs/evolved/GITHUB_GOVERNANCE.md.
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 0
      rebase-strategy: disabled
      groups:
          actions:
              patterns: ['*']
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 0
      rebase-strategy: disabled
      groups:
          compatible:
              update-types: [minor, patch]
    - package-ecosystem: npm
      directory: /services/codegraph
      schedule:
          interval: weekly
      open-pull-requests-limit: 0
      rebase-strategy: disabled
      groups:
          compatible:
              update-types: [minor, patch]
    - package-ecosystem: docker
      directories:
          - /deploy/evolved
          - /services/codegraph
          - /services/memory
          - /relay
      schedule:
          interval: weekly
      open-pull-requests-limit: 0
      rebase-strategy: disabled
    - package-ecosystem: gradle
      directory: /android
      schedule:
          interval: monthly
      open-pull-requests-limit: 0
      rebase-strategy: disabled
# Memory's requirements.lock is a separately generated, complete environment.
# Update requirements.txt and regenerate/test the lock together; a pip-only PR
# would leave the deployed lock stale. The conditional Swift manifest likewise
# needs a maintainer-reviewed update with the native conformance checks.
