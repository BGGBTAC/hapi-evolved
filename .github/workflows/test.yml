name: Test

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - name: Test PR review automation
              run: node --test .github/scripts/pr-review.test.cjs
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: '1.3.14'
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '24'
            - name: Check publication boundaries
              run: |
                  bun scripts/publication/check-workflows.ts
                  bun test scripts/publication/check-workflows.test.ts
            - run: bun install --frozen-lockfile
            - run: bun typecheck
            - run: bunx playwright install --with-deps chromium
            - name: Test Mermaid HTML and CSS isolation in Chromium
              run: timeout 90s node web/scripts/mermaid-security-check.mjs
            # Required by cli/src/utils/windowsProcessTree.pwsh.test.ts — image
            # inspect alone does not pull; silent skip was fake B1 coverage (#1911).
            - run: docker pull mcr.microsoft.com/powershell:latest
            - run: bun run test:e2e -- terminal-wrap-fidelity.spec.ts composer-copy.spec.ts session-list-scroll.spec.ts cold-initial-tail.spec.ts scrollbar-auto-hide.spec.ts
            - run: bun run test
            - run: bun run build:web
            - name: Check final PWA asset revisions
              run: node web/scripts/check-pwa-assets.mjs
            - run: bun run --cwd web test:evolved:e2e
            - name: Test integrated project workflow with real Git and Codegraph
              run: |
                  npm ci --prefix services/codegraph --ignore-scripts
                  node web/scripts/evolved-workflow-check.mjs

    # Serial runner-integration suite: starts real detached runner/session
    # process trees against an isolated temp hub, so it runs in its own job
    # (never in the parallel unit-test path). See cli/vitest.integration.config.ts.
    integration:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: '1.3.14'
            - run: bun install --frozen-lockfile
            - run: bun run test:cli:integration

    windows-codex-mcp:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: '1.3.14'
            - run: bun install --frozen-lockfile
            - run: bun run --cwd cli test -- src/codex/utils/codexMcpProxy.test.ts

    evolved-services:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '24'
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: '3.12'
            - run: npm ci --prefix services/codegraph --ignore-scripts
            - run: node --liftoff-only --test services/codegraph/test/*.test.mjs
            - run: pip install -r services/memory/requirements.lock
            - run: python -m unittest discover -s services/memory -p 'test_*.py'
