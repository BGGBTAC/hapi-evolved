name: HAPI-eVolved preview source bundle

# Explicit operator action only. Produces an Actions artifact, not a GitHub
# release, tag, package, image or deployment. A source bundle is not a binary.
on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: evolved-preview-${{ github.ref }}
    cancel-in-progress: false

jobs:
    source-bundle:
        if: github.repository == 'BGGBTAC/hapi-evolved'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: '1.3.14'
            - name: Check publication boundaries
              run: |
                  bun scripts/publication/check-workflows.ts
                  bun test scripts/publication/check-workflows.test.ts
            - run: bun install --frozen-lockfile
            - run: bun typecheck
            - run: bun run build:web
            - name: Package the exact checked-out source commit
              env:
                  SOURCE_BUNDLE_DIR: ${{ runner.temp }}/evolved-preview
              run: bun scripts/publication/bundle-source.ts
            - name: Upload reviewable preview source
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: hapi-evolved-0.1.0-preview-source-${{ github.sha }}
                  path: ${{ runner.temp }}/evolved-preview/
                  if-no-files-found: error
                  retention-days: 14
