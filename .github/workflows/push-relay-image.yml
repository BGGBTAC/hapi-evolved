# Retained for upstream history; every job is disabled outside tiann/hapi.
name: Upstream only — push relay image

on:
    push:
        branches: [main]
        paths:
            - 'relay/**'
            - 'package.json'
            - 'bun.lock'
            - 'tsconfig.base.json'
            - '.github/workflows/push-relay-image.yml'
    pull_request:
        paths:
            - 'relay/**'
            - 'package.json'
            - 'bun.lock'
            - 'tsconfig.base.json'
            - '.github/workflows/push-relay-image.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: push-relay-image-${{ github.ref }}
    cancel-in-progress: true

jobs:
    image:
        if: github.repository == 'tiann/hapi'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: '1.3.14'
            - run: bun install --frozen-lockfile
            - run: bun run typecheck:relay
            - run: bun run test:relay

            - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Image metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ghcr.io/${{ github.repository_owner }}/hapi-push-relay
                  tags: |
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
                      type=sha,format=long
                  labels: |
                      org.opencontainers.image.title=HAPI Push Relay
                      org.opencontainers.image.description=Forwards encrypted HAPI push envelopes to APNs and FCM
                      org.opencontainers.image.licenses=AGPL-3.0-only

            - name: Log in to GHCR
              if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and publish
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: ./relay
                  platforms: linux/amd64,linux/arm64
                  push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=push-relay
                  cache-to: type=gha,scope=push-relay,mode=max
